<!doctype html><html lang="en"><meta charset="utf-8"><title>Local drag upload verification</title><style>body{margin:0;font:16px system-ui}header{height:55px;padding:10px;display:flex;gap:20px;align-items:center;box-sizing:border-box}button{padding:6px 14px}iframe{border:0;width:100%;height:1000px}</style><header><button draggable="true" id="valid">Drag test PNG</button><button draggable="true" id="invalid">Drag text file</button><button draggable="true" id="multiple">Drag two images</button><button draggable="true" id="large">Drag oversized image</button></header><iframe src="/" title="Atlas under test"></iframe><script>
const png=()=>new File([Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l9sAAAAASUVORK5CYII='),c=>c.charCodeAt(0))],'test.png',{type:'image/png'});
for(const id of ['valid','invalid','multiple','large'])document.getElementById(id).addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='copy';e.dataTransfer.items.add(id==='invalid'?new File(['test'],'test.txt',{type:'text/plain'}):id==='large'?new File([new Uint8Array(3000001)],'large.png',{type:'image/png'}):png());if(id==='multiple')e.dataTransfer.items.add(png())});
</script></html>
